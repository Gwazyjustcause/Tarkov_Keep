<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Check which Escape from Tarkov loot to keep for tasks, Collector and Hideout upgrades.">
<title>Tarkov Loot Checker</title>
<link rel="stylesheet" href="style.css">
<script defer src="data.js"></script>
<script defer src="progress.js"></script>
<script defer src="loot.js"></script>
</head>
<body>
<header><div class="wrap top"><span class="brand"><span class="mark" aria-hidden="true">▥</span> Tarkov Gear Compare</span><div class="view-links"><a id="compare-link" href="./">Compare</a><a href="loot.html" aria-current="page">Loot checker</a><a id="tasks-link" href="tasks.html">Tasks</a></div><label class="mode">Game mode <select id="mode"><option value="pvp">PvP</option><option value="pve">PvE</option></select></label></div></header>
<main class="wrap">
<section class="intro"><h1>Keep or sell<span>?</span></h1><p>Check loot against tasks, Collector and Hideout upgrades.</p></section>
<div class="loot-controls">
<label>Search loot <input id="loot-search" type="search" placeholder="Try Salewa, GPU or LEDX" autocomplete="off"></label>
<label>Show <select id="loot-filter"><option value="all">All items</option><option value="needed">Keep</option><option value="fir">Found in Raid needed</option><option value="kappa">Collector / Kappa</option><option value="hideout">Hideout</option><option value="sell">No remaining requirement</option></select></label>
</div>
<div class="toolbar"><p id="status" role="status">Loading loot…</p></div>
<section id="loot-results" aria-label="Loot search results"></section>
<button id="more" type="button" hidden>Show more results</button>
<p class="sub loot-note">Recommendations cover listed tasks and Hideout upgrades. Flea prices are 24-hour averages before fees.</p>
</main>
<footer class="wrap"><span id="snapshot"></span><a href="https://tarkov.dev/api/">Data and item images by Tarkov.dev ↗</a></footer>
</body>
</html>
